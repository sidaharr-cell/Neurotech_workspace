name: Daily Neurotech Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6am UTC
  workflow_dispatch:        # lets you trigger manually from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # allows committing the refreshed data snapshots

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: neurotech-index/package-lock.json

      - name: Install dependencies
        working-directory: neurotech-index
        run: npm ci

      - name: Run refresh
        working-directory: neurotech-index
        run: node scripts/refresh.js
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}

      - name: Refresh companies (NeuroTechX Airtable + curated)
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-companies.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh labs (NIH RePORTER + NeuroTechX academic labs)
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-labs.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh company funding (SEC EDGAR, all companies — incremental)
        working-directory: neurotech-index
        continue-on-error: true
        # --commit is required since Phase 2: the script is dry-run by default so
        # a local run can never write to production by accident.
        run: node scripts/backfill-funding.js --commit
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # The three cheap backfills below re-apply facts that are derived from
      # committed decision files or from records already in the database, so they
      # take seconds and are idempotent. They run nightly so the dataset repairs
      # itself: on 29 Jul 2026 the companies backfill deleted and re-inserted
      # every company row and took the whole funding dataset with it, and nothing
      # in this workflow would have restored it. See
      # docs/funding-data-loss-2026-07-29.md.
      - name: Re-apply company status (SEC ticker file + curated filings)
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-org-status.js --commit
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Re-apply inclusion decisions and modality
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-inclusion.js --commit
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Re-derive furthest stage (openFDA + ClinicalTrials.gov)
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-stage.js --commit
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Refresh company publications (PubMed + Claude judge — incremental)
        working-directory: neurotech-index
        continue-on-error: true
        run: node scripts/backfill-company-analytics.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Refresh recent patents (PatentsView)
        working-directory: neurotech-index
        continue-on-error: true
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PATENTSVIEW_API_KEY:  ${{ secrets.PATENTSVIEW_API_KEY }}
        run: |
          if [ -z "$PATENTSVIEW_API_KEY" ]; then echo "No PatentsView key set, skipping patents."; exit 0; fi
          export PATENTS_SINCE=$(date -u -d '35 days ago' +%Y-%m-%d 2>/dev/null || date -u -v-35d +%Y-%m-%d)
          node scripts/backfill-patents.js

      - name: Commit updated data (funding + notable research + Airtable snapshots)
        run: |
          git config user.name "neurobase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add neurotech-index/src/data/notable.json \
                  neurotech-index/scripts/data/neurotechx-industry.json \
                  neurotech-index/scripts/data/neurotechx-academic-labs.json \
                  neurotech-index/public/company-analytics
          if git diff --cached --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "chore: auto-update funding + notable research"
          # Rebase onto any commits pushed while the job ran (deploys, etc.),
          # then push. Retry so the job never fails a simple race.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i lost a race, retrying..."; sleep 5
          done
          echo "::error::could not push data update after 3 attempts"; exit 1

      # The last word, and deliberately NOT continue-on-error.
      #
      # Every other step tolerates failure so one dead API cannot stop the rest,
      # which is right, but it means the workflow reports success almost
      # unconditionally. On 29 Jul 2026 it reported success while deleting the
      # entire funding dataset: each pipeline did exactly what it was told, and
      # nothing checked whether the rows another pipeline owned had survived.
      #
      # This step fails the run when the table has collapsed, so the alarm is
      # the workflow going red rather than somebody noticing weeks later.
      - name: Verify the run destroyed nothing
        working-directory: neurotech-index
        run: node scripts/verify-cron.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
