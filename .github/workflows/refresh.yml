name: Daily Neurotech Refresh

on:
  schedule:
    # 06:23 UTC, not 06:00. GitHub queues every scheduled workflow on the
    # planet at the top of the hour and runs them as capacity frees up, so a
    # job asking for :00 is at the back of the longest queue of the day. Runs
    # 55-62 started within ten minutes of their slot; runs 63-68, all still
    # asking for :00, started as much as twelve hours late. An odd minute is
    # the only lever the schedule offers — GitHub promises no start time for
    # cron either way, which is why nothing downstream assumes one.
    - cron: '23 6 * * *'  # every day at 06:23 UTC
  workflow_dispatch:        # lets you trigger manually from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 75 minutes for the JOB; the sequence itself is capped at 55 below. The
    # gap is deliberate — see the note on that step. A job-level timeout is a
    # cancellation, and a cancelled job runs no further steps, which is how
    # 26 and 27 Aug lost their commit AND their integrity check while showing
    # up as neither a failure nor a success.
    timeout-minutes: 75
    permissions:
      contents: write   # allows committing the refreshed data snapshots

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: neurotech-index/package-lock.json

      - name: Install dependencies
        working-directory: neurotech-index
        run: npm ci

      # The whole sequence, in scripts/daily.js — one definition of the order,
      # shared with `npm run daily` so a person at a terminal does the same work
      # this job does. It used to be seventeen steps here, which meant the
      # obvious manual command (`npm run refresh`) ran the first of them and
      # left the day's new records without pictures.
      #
      # Failure policy is unchanged and lives in the script: every step is
      # best-effort except the refresh itself, so one dead upstream API cannot
      # stop the rest. Each step is a ::group:: in the log below.
      #
      # The cap lives HERE rather than on the job so that an overrun fails one
      # step instead of cancelling the run: the two steps below carry
      # `if: !cancelled()` and still commit what the sequence managed to write
      # and still run the alarm. Recent runs take 16-17 minutes; 55 is roughly
      # triple that, and above the 45 that 26 and 27 Aug hit.
      - name: Run the daily sequence
        id: daily
        timeout-minutes: 55
        working-directory: neurotech-index
        run: npm run daily
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          PATENTSVIEW_API_KEY:  ${{ secrets.PATENTSVIEW_API_KEY }}
          # Two steps in the sequence compose the home page through the PAGE'S
          # own code, so they read Supabase through src/lib/supabase.js, which
          # wants the VITE_ names. There is no .env here — it is gitignored —
          # so they are passed explicitly. src/lib/supabase.js also falls back
          # to the unprefixed names, and either route works; this one is here
          # so the dependency is visible in the workflow rather than only in a
          # comment three files away.
          VITE_SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The "What's new today" digest, mailed by the last step of the
          # sequence. Both are optional: without them scripts/send-digest.js
          # prints a ::warning:: and sends nothing, which is what a repo with no
          # mail provider configured should do rather than fail the run.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_FROM:    ${{ secrets.DIGEST_FROM }}
          SITE_ORIGIN:    ${{ vars.SITE_ORIGIN }}

      # image-ledger.json and image-review.json are as load-bearing here as
      # notable.json. The ledger is the ONLY record of which photograph belongs
      # to which story and which story led yesterday; drop it and the same
      # pictures are handed out again tomorrow and the lead stops rotating. The
      # review file carries the queue the daily reviewer works from.
      #
      # Runs even when the sequence above failed or timed out. The steps are
      # best-effort by design and the files they wrote before the failure are
      # the day's work; throwing them away would mean the same pictures handed
      # out again tomorrow and the lead not rotating.
      - name: Commit updated data (funding, notable research, image ledger, Airtable snapshots)
        if: ${{ !cancelled() && steps.daily.conclusion != 'skipped' }}
        run: |
          git config user.name "neurobase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add neurotech-index/src/data/notable.json \
                  neurotech-index/src/data/image-focus.json \
                  neurotech-index/src/data/image-ledger.json \
                  neurotech-index/src/data/image-review.json \
                  neurotech-index/scripts/data/fda-product-codes.json \
                  neurotech-index/scripts/data/neurotechx-industry.json \
                  neurotech-index/scripts/data/neurotechx-academic-labs.json \
                  neurotech-index/public/company-analytics
          if git diff --cached --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "chore: auto-update funding, notable research and the image ledger"
          # Rebase onto any commits pushed while the job ran (deploys, etc.),
          # then push. Retry so the job never fails a simple race.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i lost a race, retrying..."; sleep 5
          done
          echo "::error::could not push data update after 3 attempts"; exit 1

      # The last word, and deliberately NOT continue-on-error.
      #
      # Every other step tolerates failure so one dead API cannot stop the rest,
      # which is right, but it means the workflow reports success almost
      # unconditionally. On 29 Jul 2026 it reported success while deleting the
      # entire funding dataset: each pipeline did exactly what it was told, and
      # nothing checked whether the rows another pipeline owned had survived.
      #
      # This step fails the run when the table has collapsed, so the alarm is
      # the workflow going red rather than somebody noticing weeks later.
      # Also `!cancelled()`: the alarm is least dispensable on exactly the days
      # the sequence went wrong. A half-finished run is when a table is most
      # likely to have lost rows, and it is the one case the old arrangement
      # skipped the check entirely.
      - name: Verify the run destroyed nothing
        if: ${{ !cancelled() && steps.daily.conclusion != 'skipped' }}
        working-directory: neurotech-index
        run: node scripts/verify-cron.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
