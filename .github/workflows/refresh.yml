name: Daily Neurotech Refresh

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 6am UTC
  workflow_dispatch:        # lets you trigger manually from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # allows committing the refreshed data snapshots

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: neurotech-index/package-lock.json

      - name: Install dependencies
        working-directory: neurotech-index
        run: npm ci

      # The whole sequence, in scripts/daily.js — one definition of the order,
      # shared with `npm run daily` so a person at a terminal does the same work
      # this job does. It used to be seventeen steps here, which meant the
      # obvious manual command (`npm run refresh`) ran the first of them and
      # left the day's new records without pictures.
      #
      # Failure policy is unchanged and lives in the script: every step is
      # best-effort except the refresh itself, so one dead upstream API cannot
      # stop the rest. Each step is a ::group:: in the log below.
      - name: Run the daily sequence
        working-directory: neurotech-index
        run: npm run daily
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NEWS_API_KEY:         ${{ secrets.NEWS_API_KEY }}
          PATENTSVIEW_API_KEY:  ${{ secrets.PATENTSVIEW_API_KEY }}

      # image-ledger.json and image-review.json are as load-bearing here as
      # notable.json. The ledger is the ONLY record of which photograph belongs
      # to which story and which story led yesterday; drop it and the same
      # pictures are handed out again tomorrow and the lead stops rotating. The
      # review file carries the queue the daily reviewer works from.
      - name: Commit updated data (funding, notable research, image ledger, Airtable snapshots)
        run: |
          git config user.name "neurobase-bot"
          git config user.email "bot@users.noreply.github.com"
          git add neurotech-index/src/data/notable.json \
                  neurotech-index/src/data/image-focus.json \
                  neurotech-index/src/data/image-ledger.json \
                  neurotech-index/src/data/image-review.json \
                  neurotech-index/scripts/data/fda-product-codes.json \
                  neurotech-index/scripts/data/neurotechx-industry.json \
                  neurotech-index/scripts/data/neurotechx-academic-labs.json \
                  neurotech-index/public/company-analytics
          if git diff --cached --quiet; then
            echo "No data changes."; exit 0
          fi
          git commit -m "chore: auto-update funding, notable research and the image ledger"
          # Rebase onto any commits pushed while the job ran (deploys, etc.),
          # then push. Retry so the job never fails a simple race.
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"; exit 0
            fi
            echo "push attempt $i lost a race, retrying..."; sleep 5
          done
          echo "::error::could not push data update after 3 attempts"; exit 1

      # The last word, and deliberately NOT continue-on-error.
      #
      # Every other step tolerates failure so one dead API cannot stop the rest,
      # which is right, but it means the workflow reports success almost
      # unconditionally. On 29 Jul 2026 it reported success while deleting the
      # entire funding dataset: each pipeline did exactly what it was told, and
      # nothing checked whether the rows another pipeline owned had survived.
      #
      # This step fails the run when the table has collapsed, so the alarm is
      # the workflow going red rather than somebody noticing weeks later.
      - name: Verify the run destroyed nothing
        working-directory: neurotech-index
        run: node scripts/verify-cron.js
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
